services:
  - type: web
    name: payflow-upi-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: MERCHANT_NAME
        value: MGOCSM Jaipur
      - key: MERCHANT_UPI_ID
        value: mgocsmjaipur@nsdl
      - key: DATABASE_PATH
        value: ./database/upi_display.db
      - key: ANDROID_DEVICE_TOKEN
        value: upi_secure_token_987654321
      - key: PAYMENT_PROVIDER
        value: hybrid
      - key: CORS_ORIGIN
        value: "*"
